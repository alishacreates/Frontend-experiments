<!-- Write a program to build a Chat module using HTML CSS and
JavaScript. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Chat Module</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-box" id="box">
        <div class="profile">
            <img src="ilya.jpeg" alt="" id="image" width="50px" height="50px">
            <p id="ilya">Ilya Rozanov</p>
        </div>

        <div class="chat-field">
            <input type="text" name="" id="message" placeholder="enter a message..">
            <button class="fa-solid fa-paper-plane" id="send"></button>
        </div>
    </div>
</body>
</html>
